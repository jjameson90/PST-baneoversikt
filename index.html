<!doctype html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0b1f3a">
<title>PST Baneoversikt</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230b1f3a'/%3E%3Crect x='6' y='9' width='20' height='14' rx='1.5' fill='none' stroke='%2331c48d' stroke-width='2'/%3E%3Cline x1='16' y1='9' x2='16' y2='23' stroke='%2331c48d' stroke-width='2'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.css">
<script src="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.js"></script>
<style>
:root{--navy:#0b1f3a;--navy-2:#132c4f;--navy-3:#1c3b66;--tekst:#e8eef6;--demp:#9fb0c6;--linje:rgba(255,255,255,.1);--aksent:#31c48d;--oransje:#c4561a;--kort-tekst:#142235;--kort-demp:#5b6b80;--kort-linje:#e3e8ef;--topp-h:56px;--liste-b:380px;--detalj-b:420px;font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-size:14px;color-scheme:light}
*{box-sizing:border-box}html,body{margin:0;height:100%}body{background:var(--navy);color:var(--tekst);overflow:hidden}
a{color:#1f6fd1}button{font:inherit;cursor:pointer}input,select{font:inherit}
.app{display:grid;height:100%;grid-template-rows:var(--topp-h) 1fr;grid-template-columns:var(--liste-b) 1fr 0;grid-template-areas:"topp topp topp" "liste kart detalj"}
.app.uten-liste{grid-template-columns:0 1fr 0}.app.med-detaljer{grid-template-columns:var(--liste-b) 1fr var(--detalj-b)}.app.uten-liste.med-detaljer{grid-template-columns:0 1fr var(--detalj-b)}
.app.uten-liste .sidepanel{display:none}.app:not(.med-detaljer) .detaljer{display:none}
.topp{grid-area:topp;display:flex;align-items:center;gap:12px;padding:0 12px;border-bottom:1px solid var(--linje);z-index:5;background:var(--navy)}
.meny{background:none;border:0;color:var(--tekst);font-size:20px;padding:4px 8px;border-radius:6px}.meny:hover{background:var(--navy-3)}
.logo{display:flex;align-items:center;gap:10px;font-weight:600;white-space:nowrap}.logo small{display:block;font-weight:400;color:var(--demp);font-size:11.5px}
.logo-merke{background:var(--aksent);color:var(--navy);font-weight:800;padding:4px 7px;border-radius:6px}
.topp-kilder{margin-left:auto;color:var(--demp)!important}
.sok{position:relative;flex:1;max-width:460px;margin-left:12px}
.sok input{width:100%;padding:9px 12px;border-radius:8px;border:1px solid var(--linje);background:var(--navy-2);color:var(--tekst);outline:none}.sok input:focus{border-color:var(--aksent)}
.sok-liste{position:absolute;top:calc(100% + 6px);left:0;right:0;background:#fff;color:var(--kort-tekst);border-radius:10px;box-shadow:0 12px 32px rgba(0,0,0,.35);max-height:70vh;overflow:auto;padding:6px 0;z-index:20}
.sok-liste button{display:block;width:100%;text-align:left;border:0;background:none;padding:8px 12px;color:inherit}.sok-liste button small{display:block;color:var(--kort-demp);margin-left:18px}
.sok-liste button.aktiv,.sok-liste button:hover{background:#eef4fb}.sok-gruppe{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--kort-demp);padding:8px 12px 2px}.sok-info{padding:8px 12px;color:var(--kort-demp)}
.prikk{display:inline-block;width:10px;height:10px;border-radius:50%;vertical-align:middle}
.sidepanel{grid-area:liste;overflow-y:auto;border-right:1px solid var(--linje);padding:12px;min-width:0}
.kpi{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.kpi button{background:var(--navy-2);border:1px solid var(--linje);border-radius:8px;padding:7px 6px;color:var(--tekst);text-align:left;display:flex;flex-direction:column;gap:1px}
.kpi button:hover{border-color:rgba(255,255,255,.3)}.kpi button.pa{border-color:var(--aksent);box-shadow:inset 0 0 0 1px var(--aksent)}.kpi button.dempet{opacity:.45}
.kpi b{font-size:18px;line-height:1.1}.kpi span{font-size:11px;color:var(--demp);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.filtre{margin-top:12px;display:flex;flex-direction:column;gap:8px}
.filtre input[type=search],.filtre select,.listehode select{width:100%;padding:8px 10px;border-radius:8px;border:1px solid var(--linje);background:var(--navy-2);color:var(--tekst)}
.rad2{display:flex;gap:8px;flex-wrap:wrap}.rad2>select,.rad2>label.glider{flex:1 1 140px}
.sjekk{display:flex;gap:5px;align-items:center;color:var(--demp);font-size:13px}
.lenke{background:none;border:0;padding:0;color:#7fb4ff;font-size:13px;text-align:left}.lenke:hover{text-decoration:underline}
.listehode{display:flex;justify-content:space-between;align-items:center;margin-top:14px;gap:8px;color:var(--demp)}.listehode b{color:var(--tekst)}.listehode select{width:auto;max-width:180px;padding:5px 8px}
.listeknapper{display:flex;gap:14px;margin:6px 0 8px;flex-wrap:wrap}
.liste{list-style:none;margin:0;padding:0}
.li{display:grid;grid-template-columns:40px 1fr auto;gap:10px;width:100%;align-items:center;text-align:left;background:none;border:0;border-bottom:1px solid var(--linje);color:var(--tekst);padding:9px 4px}
.li:hover{background:var(--navy-2)}.li.valgt{background:var(--navy-3)}
.li-prio{color:#fff;border-radius:6px;font-weight:700;text-align:center;padding:4px 0;font-size:12.5px}
.li-tekst{min-width:0;display:flex;flex-direction:column;gap:2px}.li-navn{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li-under{color:var(--demp);font-size:12px}.li-signal{color:#ffd479;font-size:11.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.li-nff{display:inline-block;background:#8e44ad;color:#fff;font-size:10.5px;font-weight:700;padding:1px 6px;border-radius:8px;margin-left:6px;vertical-align:1px;letter-spacing:.3px}
.li.nff .li-prio{box-shadow:0 0 0 2px #c39bd3}
.faner{display:flex;gap:4px;margin-top:14px;border-bottom:1px solid var(--linje)}.faner button{flex:1;background:none;border:0;border-bottom:2px solid transparent;color:var(--demp);padding:7px 4px;font-weight:600}
.faner button.pa{color:var(--tekst);border-bottom-color:var(--aksent)}
.gr{display:block;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--linje);color:var(--tekst);padding:9px 4px}.gr:hover{background:var(--navy-2)}
.gr-navn{font-weight:600;display:flex;justify-content:space-between;gap:8px}.gr-navn span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gr-tall{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:12px;color:var(--demp);margin-top:3px}.gr-tall b{color:var(--tekst)}
.gr-bar{display:flex;height:5px;border-radius:3px;overflow:hidden;margin-top:5px;background:var(--navy-2)}.gr-bar i{display:block}
.li-score{font-weight:700;font-size:15px}
.flere{width:100%;margin:10px 0 30px;padding:9px;border-radius:8px;border:1px solid var(--linje);background:var(--navy-2);color:var(--tekst)}
.tom{color:var(--demp);font-size:13px}
.kartflate{grid-area:kart;position:relative;min-width:0}#kart{position:absolute;inset:0}
.hint{position:absolute;top:12px;left:50%;transform:translateX(-50%);background:rgba(11,31,58,.85);color:#fff;padding:6px 12px;border-radius:20px;font-size:12.5px;pointer-events:none;z-index:3;white-space:nowrap}
.adrmarkor{width:18px;height:18px;border-radius:50%;background:#1f6fd1;border:3px solid #fff;box-shadow:0 0 0 6px rgba(31,111,209,.25)}
.tips .maplibregl-popup-content{padding:7px 10px;font-size:12.5px;color:var(--kort-tekst);border-radius:8px}
.lagpanel{position:absolute;top:12px;left:12px;z-index:4;color:var(--kort-tekst);max-width:calc(100% - 80px)}
.lagknapp{display:flex;gap:6px;align-items:center;background:#fff;border:0;border-radius:8px;padding:8px 12px;box-shadow:0 2px 10px rgba(0,0,0,.25);font-weight:600;color:var(--kort-tekst)}
.laginnhold{margin-top:6px;background:#fff;border-radius:10px;box-shadow:0 6px 20px rgba(0,0,0,.25);padding:10px 12px;width:275px;max-width:100%;display:flex;flex-direction:column;gap:8px}
.lagtittel{font-size:11px;text-transform:uppercase;color:var(--kort-demp);letter-spacing:.6px}
.segment{display:flex;border:1px solid var(--kort-linje);border-radius:8px;overflow:hidden}.segment button{flex:1;border:0;background:#fff;padding:6px 4px;font-size:12.5px;color:var(--kort-tekst)}.segment button.pa{background:var(--navy);color:#fff}
.bryter{display:flex;gap:8px;align-items:flex-start;font-size:13px}.bryter small{display:block;color:var(--kort-demp);font-size:11.5px}
.glider{display:flex;flex-direction:column;gap:2px;font-size:12px;color:var(--kort-demp)}.sidepanel .glider{color:var(--demp)}
.merk{margin:0;font-size:12px;color:#7a4b00;background:#fff6e0;padding:6px 8px;border-radius:6px}
.lagstat{font-size:11.5px;color:var(--kort-demp);border-top:1px solid var(--kort-linje);padding-top:6px}
.lagpanel .lenke,.detaljer .lenke,.modal .lenke{color:#1f6fd1}
.tegn{position:absolute;left:12px;bottom:64px;z-index:3;background:rgba(255,255,255,.92);color:var(--kort-tekst);border-radius:8px;padding:6px 10px;display:flex;flex-wrap:wrap;gap:4px 12px;font-size:11.5px;max-width:calc(100% - 140px);box-shadow:0 2px 8px rgba(0,0,0,.2)}
.tegn i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:middle}
.detaljer{grid-area:detalj;background:#f5f7fa;color:var(--kort-tekst);overflow-y:auto;min-width:0}
.dhode{background:#fff;padding:16px 16px 12px;border-top:5px solid #7f8c8d;position:relative;border-bottom:1px solid var(--kort-linje)}
.dprio{font-size:12px;font-weight:700;color:var(--kort-demp)}.detaljer h2{margin:2px 30px 2px 0;font-size:19px;line-height:1.25}.dsted{color:var(--kort-demp);font-size:13px}
.lukk{position:absolute;right:10px;top:8px;border:0;background:none;font-size:24px;line-height:1;color:var(--kort-demp)}
.merker{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}.merke{color:#fff;font-size:11.5px;padding:2px 8px;border-radius:10px;font-weight:600}
.merke.nff{background:#6c3483}.merke.inne{background:#2e86c1}.merke.lys{background:#e8edf3;color:var(--kort-tekst)}.merke.pipe{background:var(--oransje)}
.score{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;align-items:center;margin-top:12px}.score-tall{font-size:30px;font-weight:800;grid-row:span 2}.score-tall small{font-size:13px;color:var(--kort-demp);font-weight:500}
.sbar{height:10px;background:#e8edf3;border-radius:5px;overflow:hidden;display:flex}.sbar i{display:block}.sdel{font-size:12px;color:var(--kort-demp)}
.knapper{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}.knapper>*{border-radius:7px;padding:6px 10px;font-size:12.5px;text-decoration:none;border:1px solid var(--kort-linje);background:#fff;color:var(--kort-tekst)}
.knapper .primar{background:var(--navy);color:#fff;border-color:var(--navy);font-weight:600}
.dkropp{padding:12px;display:flex;flex-direction:column;gap:10px}
.boks{background:#fff;border:1px solid var(--kort-linje);border-radius:10px;padding:10px 12px}.boks h3{margin:0 0 6px;font-size:12px;text-transform:uppercase;letter-spacing:.5px;color:var(--kort-demp)}
.boks p{margin:0 0 8px;line-height:1.45}.boks.frem{border-left:4px solid var(--aksent)}.boks.meta{background:transparent;border-style:dashed}
.forkl{font-size:12.5px;color:#39465a;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
dl{margin:0}.r{display:grid;grid-template-columns:130px 1fr;gap:8px;padding:4px 0;border-bottom:1px dashed #edf0f4;font-size:13px}.r:last-child{border-bottom:0}dt{color:var(--kort-demp)}dd{margin:0;word-break:break-word}
.sig{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}.sig li{font-size:13px;border-left:3px solid #f0a500;padding:2px 0 2px 8px}.sig li.ut{border-left-color:#c9d1dc;color:var(--kort-demp)}
.sig small{color:var(--kort-demp)}.poeng{font-weight:700;color:#a76b00}.poeng.neg{color:#9b2c2c}
.mini{list-style:none;margin:0 0 6px;padding:0}.mini button{display:flex;gap:6px;align-items:center;width:100%;text-align:left;border:0;background:none;padding:5px 2px;font-size:13px;color:var(--kort-tekst)}.mini button:hover{background:#f0f4f9}.mini small{margin-left:auto;color:var(--kort-demp)}
.reise-rad{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:6px 0}
.reise-rad>button,.reise-rad select{border:1px solid var(--kort-linje);background:#fff;border-radius:7px;padding:5px 9px;font-size:12.5px;color:var(--kort-tekst)}
.reise-rad>button.primar{background:var(--navy);border-color:var(--navy);color:#fff;font-weight:600}
.reise-sok{position:relative;max-width:none;margin:0;flex:1 1 100%}.reise-sok input{background:#fff;color:var(--kort-tekst);border:1px solid var(--kort-linje)}
.rute{display:flex;gap:8px;align-items:flex-start;padding:7px 8px;border:1px solid var(--kort-linje);border-radius:8px;margin-top:6px;cursor:pointer;font-size:13px}
.rute.pa{border-color:#1f6fd1;background:#eef4fb}.rute small{display:block;color:var(--kort-demp)}.rute input{margin-top:3px}
.rute-sum{margin-top:8px;font-size:13px;line-height:1.5}.reise-feil{color:#9b2c2c;font-size:13px}
.startmarkor{width:16px;height:16px;border-radius:4px;background:#0b1f3a;border:3px solid #fff;box-shadow:0 0 0 4px rgba(11,31,58,.25)}
.kildelinje{font-size:11.5px;color:var(--kort-demp);margin:-2px 2px 0}
.modalbg{position:fixed;inset:0;background:rgba(5,14,28,.6);display:grid;place-items:center;z-index:50;padding:16px}
.modal{background:#fff;color:var(--kort-tekst);border-radius:12px;max-width:980px;width:100%;max-height:90vh;overflow:auto;padding:20px 24px;position:relative}.modal h2{margin-top:0}
.vilkar{border-collapse:collapse;width:100%;font-size:13px}.vilkar th,.vilkar td{text-align:left;vertical-align:top;padding:7px 8px;border-bottom:1px solid var(--kort-linje)}.vilkar th{font-size:11.5px;text-transform:uppercase;color:var(--kort-demp)}
.laster{position:fixed;inset:0;display:grid;place-items:center;background:var(--navy);z-index:100;font-size:15px}
@media (max-width:800px){
 :root{--topp-h:104px}.topp{flex-wrap:wrap;padding:8px 12px;gap:8px}.sok{order:3;flex-basis:100%;max-width:none;margin:0}
 .app,.app.uten-liste,.app.med-detaljer,.app.uten-liste.med-detaljer{grid-template-columns:1fr;grid-template-areas:"topp" "kart"}
 .sidepanel{position:fixed;top:var(--topp-h);bottom:0;left:0;width:min(100%,420px);z-index:10;background:var(--navy)}
 .detaljer{position:fixed;left:0;right:0;bottom:0;height:62vh;z-index:11;border-radius:14px 14px 0 0;box-shadow:0 -8px 30px rgba(0,0,0,.35)}
 .tegn,.topp-kilder{display:none}.laginnhold{width:240px}.hint{top:auto;bottom:40px}
}
</style>
</head>
<body>
<div class="laster" id="laster">Laster kunstgressbaner …</div>
<div class="app" id="app">
  <header class="topp">
    <button class="meny" id="meny" aria-label="Vis/skjul liste">☰</button>
    <div class="logo"><span class="logo-merke">PST</span><span>Kunstgressbaner i Norge<small id="undertittel"></small></span></div>
    <div class="sok" id="sok"><input type="search" placeholder="Søk adresse, sted eller bane …" aria-label="Søk adresse eller bane"><div class="sok-liste" hidden></div></div>
    <button class="lenke topp-kilder" id="kilderknapp">Kilder og vilkår</button>
  </header>
  <aside class="sidepanel" id="sidepanel"></aside>
  <main class="kartflate">
    <div id="kart"></div>
    <div class="hint" id="hint" hidden></div>
    <div class="lagpanel" id="lagpanel"></div>
    <div class="tegn" id="tegn"></div>
  </main>
  <aside class="detaljer" id="detaljer"></aside>
</div>
<div id="modal"></div>

<script>
'use strict';
// ============================================================ innstillinger
// Detaljerte 3D-bygg fra Allemannsdata kan ikke hentes direkte fra en annen nettside (nettleseren blokkerer
// det). Legg inn adressen til proxyen i worker/allemannsdata-proxy.js her (f.eks.
// 'https://pst-bygg.<navn>.workers.dev/'), så brukes de detaljerte byggene. Tom = enkle OSM-bygg.
const BYGG_PROXY = '';

// ============================================================ kilder
const KILDER = {
  stil: 'https://tiles.openfreemap.org/styles/liberty',
  terreng: 'https://tiles.mapterhorn.com/tilejson.json',
  graatone: 'https://cache.kartverket.no/v1/wmts/1.0.0/topograatone/default/webmercator/{z}/{y}/{x}.png',
  fkb: 'https://wms.geonorge.no/skwms1/wms.fkb?SERVICE=WMS&VERSION=1.3.0&REQUEST=GetMap&FORMAT=image%2Fpng&TRANSPARENT=TRUE&STYLES=' +
       '&LAYERS=fkb_arealdekke,fkb_vann,fkb_samferdsel,fkb_bygningsmessigeanlegg,fkb_bygning,fkb_hoydekurver,fkb_presentasjonsdata' +
       '&CRS=EPSG%3A3857&WIDTH=512&HEIGHT=512&BBOX={bbox-epsg-3857}',
  bygg: (BYGG_PROXY ? BYGG_PROXY.replace(/\/?$/, '/') : 'https://allemannsdata.com/norge/tiles/') + 'norway/tileset.json',
  adresser: 'https://ws.geonorge.no/adresser/v1/sok',
  deck: 'https://unpkg.com/deck.gl@9.4.0/dist.min.js',
};
const ATTR = {
  kv: '© <a href="https://www.kartverket.no/" target="_blank" rel="noopener">Kartverket</a>',
  fkb: '© <a href="https://www.kartverket.no/" target="_blank" rel="noopener">Kartverket</a>/Geovekst (FKB)',
  terreng: '<a href="https://mapterhorn.com/attribution" target="_blank" rel="noopener">© Mapterhorn</a>',
  bygg: '3D-bygg: <a href="https://allemannsdata.com/norge/data.html" target="_blank" rel="noopener">Allemannsdata</a> (© Kartverket CC BY 4.0, © OpenStreetMap ODbL)',
  baner: 'Baner: Anleggsregisteret, NFF, Enhetsregisteret, Doffin',
};
const VILKAR = [
  ['OpenFreeMap (OpenStreetMap)', 'https://openfreemap.org/', 'Vektorkart «Liberty» og enkle 3D-bygg', 'Kartdata © OpenStreetMap-bidragsytere (ODbL), © OpenMapTiles. Gratis, ingen nøkkel, kommersiell bruk tillatt. Kildehenvisning vises i kartet.'],
  ['Mapterhorn', 'https://mapterhorn.com/attribution', '3D-terreng og skyggelegging', 'Åpne høydedata. Krever «© Mapterhorn» med lenke.'],
  ['Kartverket – topografisk gråtone', 'https://www.kartverket.no/api-og-data/vilkar-for-bruk', 'Grunnkart «Gråtone»', 'CC BY 4.0, «© Kartverket». Data fra zoom 12 og innover er Geovekst-data: fritt å vise, ikke kopiere.'],
  ['Kartverket – FKB (WMS)', 'https://kartkatalog.geonorge.no/metadata/felles-kartdatabase-fkb/df7e8515-d9ce-4781-823c-f73b3bb5fe48', 'Detaljkart: banekanter, bygg, veg', '«Copyright Statens kartverk». Siden viser bare kartbilder; selve FKB-dataene krever avtale for private.'],
  ['Allemannsdata – Norges bygninger 3D', 'https://allemannsdata.com/norge/data.html', 'Detaljerte 3D-bygg (3D Tiles/GLB)', 'Bygget av Kartverkets laserdata (CC BY 4.0) og OSM-fotavtrykk (ODbL). Kildene må krediteres. Bare fliser i utsnittet lastes.'],
  ['Ruting (OSRM, FOSSGIS)', 'https://routing.openstreetmap.de/about.html', 'Reisetid og ruter til anleggene', 'Gratis rutetjeneste på OpenStreetMap-data (ODbL) for lett bruk. Én beregning per klikk. Kjøretid er uten trafikk og ventetid på ferje.'],
  ['Geonorge – adresse-API', 'https://ws.geonorge.no/adresser/v1/', 'Adressesøk', 'Åpne adressedata fra Matrikkelen, © Kartverket. Ett oppslag per søk.'],
  ['Banedata', 'https://www.anleggsregisteret.no/', 'Baner, score, kontakter og signaler', 'Anleggsregisteret, NFF-lista, Enhetsregisteret (NLOD), Doffin og kommunale kilder. Kontaktinfo er offentlig Enhetsregister-info for B2B – respekter reservasjoner.'],
];
const STATUS_REKKE = ['anbud', 'overmoden', 'moden', 'ukjent', 'prosess', 'tildelt', 'ok'];

const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);

const tel = (t) => { const s = String(t || '').replace(/[^\d+]/g, ''); return s ? 'tel:' + s : ''; };

function km(a, b) { const R = 6371, r = Math.PI / 180, dLa = (b[1] - a[1]) * r, dLo = (b[0] - a[0]) * r;
  const s = Math.sin(dLa / 2) ** 2 + Math.cos(a[1] * r) * Math.cos(b[1] * r) * Math.sin(dLo / 2) ** 2; return 2 * R * Math.asin(Math.sqrt(s)); }

function lenket(t) {
  if (!t) return '–';
  const re = /([\w.+-]+@[\w-]+(?:\.[\w-]+)+)|((?:\+47\s?)?(?:\d{2} \d{2} \d{2} \d{2}|\d{8}|02180|\d{5})(?!\d))/g;
  let ut = '', sist = 0, m;
  while ((m = re.exec(t))) {
    if (m[2] && m.index > 0 && /[\d-]/.test(t[m.index - 1])) continue;
    ut += esc(t.slice(sist, m.index)) + (m[1] ? `<a href="mailto:${esc(m[1])}">${esc(m[1])}</a>` : `<a href="${tel(m[2])}">${esc(m[2])}</a>`);
    sist = m.index + m[0].length;
  }
  return ut + esc(t.slice(sist));
}

// ============================================================ nettleser-cache for 3D-bygg
// JSON og GLB lagres i Cache Storage (14 dager, maks 400 MB). Svar som lages av lagrede bytes får
// tilbake den opprinnelige Response.url – loaders.gl bruker den til å kjenne igjen JSON og løse opp
// relative under-fliser (regions/…/tileset.json).
const BC = { navn: 'pst-bygg-v1', alder: 14 * 864e5, maks: 400 * 1048576, stat: { nett: 0, cache: 0, feil: 0 }, idx: null, bytes: 0 };
function medUrl(body, url, init) { const r = new Response(body, init); Object.defineProperty(r, 'url', { value: url }); return r; }
async function byggIndeks() {
  if (BC.idx) return BC.idx;
  BC.idx = new Map();
  try { const c = await caches.open(BC.navn);
    for (const q of await c.keys()) { const r = await c.match(q); const t = +r?.headers.get('x-lagret') || 0, n = +r?.headers.get('x-bytes') || 0;
      if (!r || Date.now() - t > BC.alder) { await c.delete(q); continue; } BC.idx.set(q.url, { t, n }); BC.bytes += n; } } catch {}
  return BC.idx;
}
async function cachedFetch(input, init) {
  const url = new URL(typeof input === 'string' ? input : input.url ?? String(input), location.href).href;
  const kan = typeof caches !== 'undefined' && isSecureContext && /\.(json|glb|b3dm)(\?|#|$)/i.test(url);
  let c = null;
  if (kan) try { c = await caches.open(BC.navn); const hit = await c.match(url);
    if (hit && Date.now() - (+hit.headers.get('x-lagret') || 0) < BC.alder) { BC.stat.cache++; oppdaterLagstat(); return medUrl(await hit.arrayBuffer(), url, { status: 200, headers: hit.headers }); }
  } catch { c = null; }
  let res;
  try { res = await fetch(url, init); } catch (e) { BC.stat.feil++; oppdaterLagstat(); throw e; }
  if (!res.ok) { BC.stat.feil++; oppdaterLagstat(); return res; }
  const body = await res.arrayBuffer(); BC.stat.nett++; oppdaterLagstat();
  if (c) { const h = new Headers({ 'content-type': res.headers.get('content-type') || 'application/octet-stream', 'x-lagret': Date.now(), 'x-bytes': body.byteLength });
    c.put(url, new Response(body.slice(0), { status: 200, headers: h })).then(async () => {
      const idx = await byggIndeks(); BC.bytes += body.byteLength - (idx.get(url)?.n || 0); idx.set(url, { t: Date.now(), n: body.byteLength });
      if (BC.bytes > BC.maks) for (const [u, p] of [...idx].sort((a, b) => a[1].t - b[1].t)) { if (BC.bytes <= BC.maks * 0.8) break; await c.delete(u); idx.delete(u); BC.bytes -= p.n; }
    }).catch(() => {}); }
  return medUrl(body, url, { status: res.status, statusText: res.statusText, headers: res.headers });
}

// ============================================================ filtrering og sortering
function passer(b, utenStatus) {
  const f = S.filter;
  if (!utenStatus && f.status.length && !f.status.includes(b.kode)) return false;
  if (f.fylke && b.fylke !== f.fylke) return false;
  if (f.kommune && b.kommune !== f.kommune) return false;
  if (f.eierkat && b.eierkategori !== f.eierkat) return false;
  if (f.eier && b.eier !== f.eier) return false;
  if (f.plass === 'ute' && erInne(b)) return false;
  if (f.plass === 'inne' && !erInne(b)) return false;
  if (f.nff && !erNff(b)) return false;
  if (f.signaler && !b.aktive_signaler) return false;
  if (f.pipeline && (b.pipeline_status || 'Ikke kontaktet') !== f.pipeline) return false;
  if (f.minScore && (b.lead_score ?? 0) < f.minScore) return false;
  if (f.iUtsnitt && S.utsnitt && b.lat != null) { const [w, s, e, n] = S.utsnitt; if (b.lon < w || b.lon > e || b.lat < s || b.lat > n) return false; }
  if (f.tekst) { const t = S.sokTekst.get(id(b)); if (!norm(f.tekst).split(/\s+/).filter(Boolean).every((o) => t.includes(o))) return false; }
  return true;
}
function beregnListe() {

  const reg = (r) => { const i = REGIONER.indexOf(r); return i < 0 ? 99 : i; };
  const cmp = {
    prioritet: (a, b) => a.prioritet - b.prioritet,
    alder: (a, b) => (b.dekke_alder ?? -1) - (a.dekke_alder ?? -1) || a.prioritet - b.prioritet,
    geografi: (a, b) => reg(a.region) - reg(b.region) || (a.fylke || '').localeCompare(b.fylke || '', 'nb') || (a.kommune || '').localeCompare(b.kommune || '', 'nb') || a.prioritet - b.prioritet,
    navn: (a, b) => a.navn.localeCompare(b.navn, 'nb'),

  S.liste = l; S.tell = t; S.nffAntall = l.filter(erNff).length;
}

function tegnListe() {

      ${b.aktive_signaler ? `<span class="li-signal">⚡ ${esc(b.aktive_signaler)}</span>` : ''}</span><span class="li-score">${b.lead_score ?? ''}</span></button></li>`; }).join('')

// Eiere / kommuner: hvem har flest baner som trenger nytt dekke (i gjeldende utvalg)
function tegnGrupper() {
  const st = S.data.meta.status, eier = S.fane === 'eiere', g = new Map();
  for (const b of S.liste) {
    const k = eier ? b.eier || '(ukjent eier)' : b.kommune || '(ukjent kommune)';
    let x = g.get(k);
    if (!x) g.set(k, x = { k, n: 0, kode: {}, nff: 0, maks: 0, fylke: b.fylke, kat: b.eierkategori, tlf: b.eier_telefon, epost: b.eier_epost, kommuner: new Set(), sig: 0 });

    x.kommuner.add(b.kommune); if (b.aktive_signaler) x.sig++;

const RUTE_URL = ['https://routing.openstreetmap.de/routed-car/route/v1/driving/', 'https://router.project-osrm.org/route/v1/driving/'];
const KJORETOY = { bil: ['Personbil', 1], henger: ['Varebil med henger (+15 %)', 1.15], lastebil: ['Lastebil (+25 %)', 1.25] };
const R = { fra: lagre.les('pst-reise-fra', null), base: lagre.les('pst-base', null), kjoretoy: lagre.les('pst-kjoretoy', 'bil'), ruter: null, retur: null, valgt: 0, laster: false, feil: '', bane: null };
let startMarkor = null;
const tid = (sek) => { const m = Math.round(sek / 60); return m < 60 ? `${m} min` : `${Math.floor(m / 60)} t ${String(m % 60).padStart(2, '0')} min`; };
const kmTekst = (m) => (m < 10000 ? (m / 1000).toFixed(1).replace('.', ',') : Math.round(m / 1000)) + ' km';
async function hentRuter(a, b, alternativer) {
  for (const base of RUTE_URL) {
    try {
      const r = await fetch(`${base}${a.lon},${a.lat};${b.lon},${b.lat}?overview=full&geometries=geojson&steps=true&alternatives=${alternativer ? 3 : 'false'}`);
      if (!r.ok) continue;
      const j = await r.json();
      if (j.code === 'Ok' && j.routes?.length) return j.routes;
      if (j.code === 'NoRoute') throw new Error('Fant ingen kjørbar rute mellom stedene.');
    } catch (e) { if (/kjørbar/.test(e.message)) throw e; }
  }
  throw new Error('Rutetjenesten svarte ikke. Prøv igjen om litt, eller bruk Google Maps-lenken.');
}
const harFerje = (rute) => rute.legs.some((l) => l.steps.some((st) => st.mode === 'ferry'));
const via = (rute) => rute.legs.map((l) => l.summary).filter(Boolean).join(', ');
function fjernRute() {

}
function tegnRute(tilpass) {
  if (!kart?.getSource('pst-rute') || !R.ruter) return;
  kart.getSource('pst-rute').setData({ type: 'FeatureCollection', features: R.ruter.map((r, i) => ({ type: 'Feature', geometry: r.geometry, properties: { i, valgt: i === R.valgt ? 1 : 0 } })) });
  startMarkor?.remove();

  startMarkor = new maplibregl.Marker({ element: el }).setLngLat([R.fra.lon, R.fra.lat]).addTo(kart);
  if (tilpass) {
    const bb = new maplibregl.LngLatBounds(); R.ruter[R.valgt].geometry.coordinates.forEach((c) => bb.extend(c));

async function beregnRute() {

    + `Retur: ${tid(R.retur.duration * f)}, ${kmTekst(R.retur.distance)}. Tur/retur: ${tid((r.duration + R.retur.duration) * f)} (${kmTekst(r.distance + R.retur.distance)}). Kjøretøy: ${KJORETOY[R.kjoretoy][0]}.`;
}

    <div class="reise-rad"><div class="sok reise-sok"><input type="search" id="reise-inn" placeholder="Fra adresse, f.eks. lageret eller hotellet …" value="${esc(R.fra?.tekst || '')}" autocomplete="off"><div class="sok-liste" hidden></div></div></div>

    ${res}
    <p class="kildelinje" style="margin-top:6px">Kjøretid fra OpenStreetMap-ruting uten trafikk og ventetid på ferje. Henger/lastebil er et grovt tillegg.</p>`;
  kobleReiseSok();

    const t = norm(q);
    const baner = S.data ? S.data.baner.filter((b) => S.sokTekst.get(id(b)).includes(t)).slice(0, 5) : [];
    valg = [...baner.map((b) => ({ b })), ...adr.map((a) => ({ a }))];
    liste.innerHTML = (baner.length ? '<div class="sok-gruppe">Baner</div>' : '') + valg.map((v, i) => v.b

    if (v.b) return velg(id(v.b), true);

        const j = await r.json(); info = '';

      } catch (e) { if (e.name === 'AbortError') return; info = 'Adressesøket svarte ikke'; }

  inp.addEventListener('focus', tegn);
  inp.addEventListener('keydown', (e) => {

// ---- lagvalg
function brukLag() {
  if (!kart?.getLayer('pst-bane')) return;
  const L = S.lag, gra = L.grunnkart === 'graatone';
  for (const lid of libertyLag) {
    if (!kart.getLayer(lid)) continue;
    let synlig = !gra;
    // OSM-klosser når detaljerte bygg ikke er tilgjengelige (eller ikke lastet ennå)
    if (lid === 'building-3d') synlig = !gra && L.bygg && S.byggStatus !== 'klar';
    kart.setLayoutProperty(lid, 'visibility', synlig ? 'visible' : 'none');
  }
  kart.setLayoutProperty('pst-graatone', 'visibility', gra ? 'visible' : 'none');
  kart.setLayoutProperty('pst-fkb', 'visibility', L.fkb ? 'visible' : 'none');
  kart.setLayoutProperty('pst-skygge', 'visibility', L.skygge ? 'visible' : 'none');
  kart.setTerrain(L.terreng ? { source: 'pst-terreng', exaggeration: L.overdrivelse } : null);
  try { kart.setSky({ 'sky-color': '#9cc3e6', 'horizon-color': '#e6eef5', 'fog-color': '#ffffff', 'sky-horizon-blend': 0.5, 'horizon-fog-blend': 0.6, 'fog-ground-blend': 0.85, 'atmosphere-blend': 0.4 }); } catch {}
  oppdaterBygg(); lagre.skriv('pst-lag', L); ved_flytt();
}

// ---- detaljerte 3D-bygg fra Allemannsdata: deck.gl lastes først når laget brukes.
// Svarer ikke kilden (typisk fordi den ikke tillater andre nettsider uten proxy), brukes OSM-bygg i stillhet,
// og vi venter et døgn før neste forsøk.
const BYGG_FEIL_NOKKEL = 'pst-bygg-feil';
if (!BYGG_PROXY && Date.now() - (lagre.les(BYGG_FEIL_NOKKEL, 0) || 0) < 864e5) S.byggStatus = 'osm';
let deckLaster = null;
function lastDeck() {
  return deckLaster ||= new Promise((ok, feil) => { const s = document.createElement('script'); s.src = KILDER.deck; s.onload = ok; s.onerror = feil; document.head.appendChild(s); });
}
const BYGG_LOAD_OPTIONS = { tileset: { updateTransforms: false, maxRequests: 8, maximumScreenSpaceError: 1.5, maximumMemoryUsage: 128 }, core: { fetch: cachedFetch } };
async function oppdaterBygg() {
  if (!kart) return;
  if (!S.lag.bygg || S.byggStatus === 'osm') { overlay?.setProps({ layers: [] }); return; }
  if (S.byggStatus === 'av') {
    S.byggStatus = 'laster';
    try {
      const r = await fetch(KILDER.bygg, { cache: 'no-store' }); // sjekk at kilden kan brukes herfra
      if (!r.ok) throw new Error('HTTP ' + r.status);
      await lastDeck();
      overlay = new deck.MapLibreOverlay({ interleaved: false, layers: [] });
      kart.addControl(overlay);
      S.byggStatus = 'klar'; lagre.skriv(BYGG_FEIL_NOKKEL, 0);
    } catch {
      S.byggStatus = 'osm'; if (!BYGG_PROXY) lagre.skriv(BYGG_FEIL_NOKKEL, Date.now());
    }
    tegnLagpanel(); brukLag(); return;
  }
  if (S.byggStatus !== 'klar') return;
  // Ett stabilt lag: samme id/data/loadOptions hele tiden, bare `visible` endres med zoom.
  overlay.setProps({ layers: [new deck.Tile3DLayer({
    id: 'allemannsdata-bygg', data: KILDER.bygg, loadOptions: BYGG_LOAD_OPTIONS, pickable: false,
    visible: S.zoom >= BYGG_MIN_ZOOM, onTileError: (_t, m) => console.warn('[3D-bygg]', m),
  })] });
}

  const blob = new Blob(['﻿' + [CSV_FELT.join(';'), ...S.liste.map((b) => CSV_FELT.map((f) => e(b[f])).join(';'))].join('\r\n')], { type: 'text/csv;charset=utf-8' });

  S.data = d;
  S.perKommune = new Map(d.baner.map((b) => [b.kommune, b.fylke]));
  for (const b of d.baner) { S.perId.set(id(b), b); S.sokTekst.set(id(b), norm(`${b.navn} ${b.kommune ?? ''} ${b.eier ?? ''} ${b.klubb_navn ?? ''} ${b.anleggsnr ?? ''}`)); }
  for (const s of d.signaler) {
    if (s.anleggsnr) { const k = String(s.anleggsnr); S.sigBane.set(k, [...(S.sigBane.get(k) || []), s]); }
    else if (s.kommune) S.sigKommune.set(s.kommune, [...(S.sigKommune.get(s.kommune) || []), s]);
  }
  $('#undertittel').textContent = `${tall(d.meta.antall)} flater · data ${dato(d.meta.oppdatert)}`;
  $('#tegn').innerHTML = STATUS_REKKE.map((k) => `<span><i style="background:${d.meta.status[k].farge}"></i>${esc(d.meta.status[k].tekst.replace(/ \(.*\)/, ''))}</span>`).join('')
    + '<span><i style="background:#fff;box-shadow:inset 0 0 0 2px #8e44ad"></i>NFF-lista</span><span><i style="background:#fff;box-shadow:inset 0 0 0 2px #9ad1ff"></i>Innendørs</span>';
  beregnListe(); tegnSidepanel(); tegnDetaljer(); tegnLagpanel(); startKart();
  $('#laster').remove();
  if (typeof caches !== 'undefined' && isSecureContext) setTimeout(() => byggIndeks().then(oppdaterLagstat), 3000);
}).catch((e) => { $('#laster').innerHTML = `Kunne ikke laste banedata (data/pst.json): ${esc(e.message)}`; });
</script>
</body>
</html>
